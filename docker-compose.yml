services:
  postgres:
    image: postgres:16-alpine
    container_name: meeting_room_db
    environment:
      POSTGRES_DB: meeting_room_db
      POSTGRES_USER: meeting_user
      POSTGRES_PASSWORD: meeting_pass
    ports:
      - "5416:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
