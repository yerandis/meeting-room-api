spring.application.name=meeting-room-api

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5416/meeting_room_db}
spring.datasource.username=${DB_USERNAME:meeting_user}
spring.datasource.password=${DB_PASSWORD:meeting_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
app.jwt.secret=${JWT_SECRET:cambiar-este-secret-por-uno-seguro-de-al-menos-32-chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
